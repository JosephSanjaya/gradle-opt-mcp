name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Enforce Conventional Commits
        run: |
          set -euo pipefail
          pattern='^(feat|fix|chore|refactor|docs|test|perf|build|ci)(\(.+\))?: .+'
          failed=0
          while IFS= read -r subject; do
            if ! echo "$subject" | grep -qE "$pattern"; then
              echo "::error::Commit message does not follow Conventional Commits: $subject"
              failed=1
            fi
          done < <(git log --no-merges --format=%s "origin/${{ github.base_ref }}..HEAD")
          exit "$failed"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Detekt & Test
        run: ./gradlew detekt test
