name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify tag is reachable from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ github.sha }}" origin/main

      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Build fat jar
        run: ./gradlew :server:fatJar -Pversion=${{ steps.version.outputs.value }}

      - name: Package artifact
        run: |
          set -euo pipefail
          jar_name="gradle-opt-mcp-${{ steps.version.outputs.value }}.jar"
          cp server/build/libs/*-all.jar "$jar_name"
          shasum -a 256 "$jar_name" > "$jar_name.sha256"

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          if [[ "${{ github.ref_name }}" =~ -(alpha|beta|rc) ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "${{ github.ref_name }}" \
            gradle-opt-mcp-*.jar gradle-opt-mcp-*.jar.sha256 \
            --title "${{ github.ref_name }}" \
            --notes "${{ steps.changelog.outputs.content }}" \
            $prerelease_flag
